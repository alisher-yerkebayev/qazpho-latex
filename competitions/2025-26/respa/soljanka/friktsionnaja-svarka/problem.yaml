- blocks:
  - prose:
      ru: 'Рассмотрим простую модель \textit{фрикционной сварки}. Имеются два одинаковых
        достаточно длинных стальных цилиндра радиусом $R=\qty1{\cm}$ с совпадающими
        осями. Один из цилиндров раскручивают с некоторой угловой скоростью $\omega$,
        и его придавливают торец к торцу зафиксированного цилиндра с постоянным давлением
        $p=\qty{20}{\MPa}$. Определите, при каком предельном $\omega$ сталь начнёт
        плавиться в стационарном режиме (спустя достаточно долгое время вращения цилиндра).
        Считайте, что температура по радиусу цилиндра быстро выравнивается. Температура
        окружающего воздуха $T_0=\qty{20}{\celsius}$. Для нержавеющей стали: коэффициент
        трения стали о сталь $\mu=0.4$, коэффициент теплопроводности $\kappa=\qty{20}{\WmK}$,
        коэффициент теплоотдачи в воздух при принудительной конвекции $\alpha=\qty{200}{\W\per\metre\squared\per\kelvin}$,
        а точка плавления $T^*=\qty{1520}{\celsius}$. Считайте параметры стали независимыми
        от её температуры; теплоёмкостью цилиндров пренебречь.


        \textbf{Математическая подсказка:} Решение дифференциального уравнения вида
        $x''''(t) = \lambda^2 x(t)$ для некоторой вещественной постоянной $\lambda$
        имеет вид

        $$

        x(t) = Ae^{\lambda t} + Be^{-\lambda t}

        $$

        для некоторых констант интегрирования $A$ и $B$, а $e=2.718...$ --- число
        Эйлера.'
