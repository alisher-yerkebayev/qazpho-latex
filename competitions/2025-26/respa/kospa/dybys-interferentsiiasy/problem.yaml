      kz: 'Екі шексіз қатты жазықтық (қабырғалар) тік бұрыш жасап қиылысады. Шексіздіктен
        жазық дыбыс толқыны келіп түседі, оның толқындық векторы дәл жазықтықтар арасындағы
        бұрыштың биссектрисасы бойымен бағытталған. Түскен толқындағы ауа молекулалары
        жылдамдығының амплитудасы $v$, ал толқын ұзындығы $\lambda$-ға тең. Қабырғалар
        идеал шағылыстырады (шағылысу энергия шығынынсыз жүреді); $\lambda$ ретіндегі
        қашықтықтағы дифракциялық эффектілерді ескермеңіз.


